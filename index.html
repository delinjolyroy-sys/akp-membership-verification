<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AKP Membership Verification</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f2f2f2;
    color: #222;
}

.container {
    max-width: 500px;
    margin: 30px auto;
    padding: 20px;
}

.card {
    background: white;
    border-radius: 18px;
    padding: 25px;
    text-align: center;
    box-shadow: 0 4px 18px rgba(0,0,0,0.15);
}

.logo {
    width: 130px;
    max-width: 60%;
    margin-bottom: 10px;
}

h1 {
    font-size: 24px;
    margin: 10px 0 5px;
}

.chapter {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 20px;
}

.photo {
    width: 180px;
    height: 180px;
    object-fit: cover;
    border-radius: 50%;
    border: 5px solid #222;
    margin: 10px auto 20px;
}

.name {
    font-size: 25px;
    font-weight: bold;
    margin: 8px 0;
}

.position {
    font-size: 18px;
    margin-bottom: 20px;
}

.details {
    text-align: left;
    background: #f7f7f7;
    border-radius: 12px;
    padding: 15px;
}

.details p {
    margin: 10px 0;
}

.status {
    margin-top: 20px;
    padding: 12px;
    border-radius: 10px;
    background: #dff5df;
    color: #176b17;
    font-weight: bold;
    font-size: 18px;
}

.note {
    margin-top: 20px;
    font-size: 14px;
    line-height: 1.5;
}
</style>
</head>

<body>

<div class="container">
<div class="card">

<img src="malitbog-logo.jpg" class="logo" alt="Malitbog Chapter Logo">

<h1>MEMBERSHIP VERIFICATION</h1>

<div class="chapter">
ALPHA KAPPA RHO<br>
MALITBOG CHAPTER
</div>

<img src="amelia-magada.jpg" class="photo" alt="Member Photo">

<div class="name">
Amelia Magada
</div>

<div class="position">
Chairwoman
</div>

<div class="details">

<p><strong>Membership ID No.:</strong><br>
AKP-MLTBG-001</p>

<p><strong>Date Survive:</strong><br>
May 22, 2022</p>

<p><strong>Chapter:</strong><br>
Malitbog Chapter</p>

</div>

<div class="status">
✓ LEGIT MEMBER
</div>

<div class="note">
The person whose name and picture appears here is a
<strong>LEGIT member of Alpha Kappa Rho Malitbog Chapter.</strong>
</div>

</div>
</div>

</body>
  </html>
